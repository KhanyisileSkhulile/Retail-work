<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <style>
      .bg{fill:#080b12}.panel{fill:#111722;stroke:#273244;stroke-width:1.2}
      .side{fill:#0c111a}.white{fill:#f3f6fc;font-family:Arial,sans-serif}
      .muted{fill:#8e9bb0;font-family:Arial,sans-serif}
      .blue{fill:#69a7ff;font-family:Arial,sans-serif}
      .teal{fill:#55d6be;font-family:Arial,sans-serif}
      .line{stroke:#293449;stroke-width:1}
      .nav{fill:#a9b5c8;font-family:Arial,sans-serif;font-size:15px}
      .small{font-size:12px}.medium{font-size:14px}.large{font-size:23px;font-weight:bold}
      .heading{font-size:27px;font-weight:bold}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1000"/>
  <rect class="side" width="235" height="1000"/>
  <line x1="235" y1="0" x2="235" y2="1000" class="line"/>

  <text x="28" y="43" class="white" font-size="23" font-weight="bold">RETAIL<tspan class="blue">X</tspan></text>
  <text x="28" y="65" class="muted small">INTELLIGENCE PLATFORM</text>
  <line x1="22" y1="88" x2="213" y2="88" class="line"/>

  <rect x="14" y="111" width="207" height="43" rx="8" fill="#1b2b43"/>
  <rect x="14" y="111" width="3" height="43" rx="1" fill="#69a7ff"/>
  <text x="34" y="138" class="white medium">▦  Dashboard</text>
  <text x="34" y="193" class="nav">▤  Sales</text>
  <text x="34" y="243" class="nav">▣  Inventory</text>
  <text x="34" y="293" class="nav">⌁  Forecasting</text>
  <text x="34" y="343" class="nav">↗  Restocking</text>
  <text x="34" y="393" class="nav">✧  AI Assistant</text>
  <text x="34" y="443" class="nav">▥  Reports</text>
  <text x="34" y="493" class="nav">⚙  Settings</text>

  <rect x="20" y="876" width="195" height="74" rx="10" class="panel"/>
  <circle cx="43" cy="904" r="12" fill="#254b50"/>
  <text x="38" y="909" class="teal medium">R</text>
  <text x="63" y="901" class="white medium">Shop Owner</text>
  <text x="63" y="920" class="muted small">Store administrator</text>
  <text x="32" y="940" class="muted small">Account and access settings</text>

  <text x="270" y="49" class="muted small">WORKSPACE / OVERVIEW</text>
  <text x="270" y="88" class="white heading">Dashboard</text>
  <text x="270" y="116" class="muted medium">Your store performance at a glance.</text>
  <rect x="1125" y="55" width="145" height="40" rx="8" class="panel"/>
  <text x="1141" y="80" class="white medium">Last 30 days  ▾</text>
  <rect x="1284" y="55" width="126" height="40" rx="8" fill="#172b46" stroke="#31517a"/>
  <text x="1301" y="80" class="blue medium">↓ Export</text>

  <rect x="270" y="148" width="270" height="132" rx="12" class="panel"/>
  <text x="290" y="177" class="muted medium">TOTAL SALES</text>
  <text x="290" y="216" class="white large">—</text>
  <text x="290" y="244" class="muted small">Currency data not connected</text>
  <rect x="487" y="164" width="31" height="31" rx="8" fill="#1d2b42"/>
  <text x="496" y="185" class="blue medium">$</text>

  <rect x="558" y="148" width="270" height="132" rx="12" class="panel"/>
  <text x="578" y="177" class="muted medium">UNITS SOLD</text>
  <text x="578" y="216" class="white large">—</text>
  <text x="578" y="244" class="muted small">Sales data not connected</text>
  <rect x="775" y="164" width="31" height="31" rx="8" fill="#1c3435"/>
  <text x="783" y="185" class="teal medium">↗</text>

  <rect x="846" y="148" width="270" height="132" rx="12" class="panel"/>
  <text x="866" y="177" class="muted medium">INVENTORY VALUE</text>
  <text x="866" y="216" class="white large">—</text>
  <text x="866" y="244" class="muted small">Valuation data unavailable</text>
  <rect x="1063" y="164" width="31" height="31" rx="8" fill="#28243e"/>
  <text x="1072" y="185" fill="#b9a5ff" font-family="Arial" font-size="17">▣</text>

  <rect x="1134" y="148" width="276" height="132" rx="12" class="panel"/>
  <text x="1154" y="177" class="muted medium">PRODUCTS TO REVIEW</text>
  <text x="1154" y="216" class="white large">—</text>
  <text x="1154" y="244" class="muted small">Inventory thresholds required</text>
  <rect x="1357" y="164" width="31" height="31" rx="8" fill="#382923"/>
  <text x="1367" y="185" fill="#ffb783" font-family="Arial" font-size="17">!</text>

  <rect x="270" y="301" width="720" height="330" rx="12" class="panel"/>
  <text x="294" y="335" class="white" font-size="18" font-weight="bold">Sales overview</text>
  <text x="294" y="358" class="muted small">Actual sales over the selected period</text>
  <rect x="825" y="316" width="140" height="32" rx="7" fill="#182235" stroke="#293c58"/>
  <text x="843" y="337" class="blue small">Daily view  ▾</text>
  <line x1="310" y1="402" x2="960" y2="402" class="line"/>
  <line x1="310" y1="454" x2="960" y2="454" class="line"/>
  <line x1="310" y1="506" x2="960" y2="506" class="line"/>
  <line x1="310" y1="558" x2="960" y2="558" class="line"/>
  <text x="325" y="440" class="muted medium">Sales chart will appear when data is available</text>
  <text x="325" y="464" class="muted small">No sample figures are displayed.</text>
  <text x="310" y="593" class="muted small">Start</text>
  <text x="925" y="593" class="muted small">End</text>
  <text x="294" y="613" class="muted small">Source: validated transaction records</text>

  <rect x="1010" y="301" width="400" height="330" rx="12" class="panel"/>
  <text x="1034" y="335" class="white" font-size="18" font-weight="bold">Forecasting summary</text>
  <text x="1034" y="358" class="muted small">Demand outlook</text>
  <rect x="1034" y="383" width="352" height="91" rx="9" fill="#0c1420" stroke="#293449"/>
  <text x="1052" y="409" class="muted small">FORECAST STATUS</text>
  <text x="1052" y="439" class="white" font-size="17" font-weight="bold">Awaiting validated data</text>
  <text x="1034" y="507" class="muted small">Forecast horizon</text>
  <text x="1370" y="507" class="white small" text-anchor="end">Not configured</text>
  <line x1="1034" y1="523" x2="1386" y2="523" class="line"/>
  <text x="1034" y="547" class="muted small">Last updated</text>
  <text x="1370" y="547" class="white small" text-anchor="end">Not available</text>
  <text x="1034" y="594" class="blue medium">Open forecasting →</text>

  <rect x="270" y="652" width="720" height="282" rx="12" class="panel"/>
  <text x="294" y="688" class="white" font-size="18" font-weight="bold">Inventory alerts</text>
  <text x="294" y="711" class="muted small">Products requiring attention</text>
  <rect x="294" y="732" width="672" height="52" rx="7" fill="#0c121c"/>
  <circle cx="316" cy="758" r="5" fill="#ffb783"/>
  <text x="333" y="754" class="white medium">Low-stock alerts</text>
  <text x="333" y="773" class="muted small">Configure stock thresholds to enable alerts.</text>
  <text x="940" y="762" class="blue small" text-anchor="end">View inventory →</text>
  <rect x="294" y="796" width="672" height="52" rx="7" fill="#0c121c"/>
  <circle cx="316" cy="822" r="5" fill="#69a7ff"/>
  <text x="333" y="818" class="white medium">Stockout risk</text>
  <text x="333" y="837" class="muted small">Risk assessment requires validated stock and demand data.</text>
  <text x="940" y="826" class="blue small" text-anchor="end">Review risks →</text>
  <text x="294" y="905" class="muted small">Alerts are advisory and depend on available data.</text>

  <rect x="1010" y="652" width="400" height="282" rx="12" class="panel"/>
  <text x="1034" y="688" class="white" font-size="18" font-weight="bold">AI Assistant</text>
  <text x="1034" y="711" class="muted small">Ask questions about your store</text>
  <rect x="1034" y="733" width="352" height="82" rx="8" fill="#0c1420" stroke="#293449"/>
  <text x="1050" y="758" class="muted medium">Try asking:</text>
  <text x="1050" y="781" class="white medium">“Which products need attention?”</text>
  <text x="1034" y="841" class="muted small">Responses use available store data.</text>
  <rect x="1034" y="858" width="274" height="44" rx="8" fill="#0b1018" stroke="#35445a"/>
  <text x="1050" y="885" class="muted medium">Ask a question...</text>
  <rect x="1318" y="858" width="68" height="44" rx="8" fill="#284d78"/>
  <text x="1337" y="885" class="white medium">Send</text>

  <text x="270" y="971" class="muted small">RETAIL-X-AI  •  M06-03 DASHBOARD WIREFRAME  •  CONCEPT DESIGN</text>
  <text x="1410" y="971" class="muted small" text-anchor="end">Desktop view</text>
</svg>
