<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <style>
      .bg{fill:#090d14}.panel{fill:#111925;stroke:#283446;stroke-width:1.5}
      .card{fill:#182333;stroke:#2b3b50;stroke-width:1}
      .white{fill:#f1f5f9;font-family:Arial,sans-serif}
      .muted{fill:#98a8bc;font-family:Arial,sans-serif}
      .blue{fill:#60a5fa}.teal{fill:#2dd4bf}.amber{fill:#fbbf24}
      .line{stroke:#35465c;stroke-width:1.5;fill:none}
      .grid{stroke:#263548;stroke-width:1;fill:none}
      .small{font-size:12px}.body{font-size:14px}.heading{font-size:21px;font-weight:bold}
      .title{font-size:28px;font-weight:bold}.label{font-size:13px;font-weight:bold}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1040"/>
  <text x="40" y="42" class="white title">Retail X</text>
  <text x="40" y="68" class="muted body">Forecasting and restocking • Inventory intelligence and demand planning</text>

  <!-- Forecasting screen -->
  <rect x="32" y="92" width="676" height="910" rx="14" class="panel"/>
  <rect x="32" y="92" width="676" height="58" rx="14" fill="#172438"/>
  <text x="54" y="127" class="white heading">Demand Forecasting</text>
  <text x="54" y="178" class="muted small">NAVIGATION</text>
  <text x="54" y="202" class="muted body">Dashboard  /  Inventory  /</text>
  <rect x="270" y="185" width="112" height="27" rx="6" fill="#24446a"/>
  <text x="282" y="203" class="white small">Forecasting</text>
  <text x="394" y="203" class="muted body">/ Restocking</text>

  <text x="54" y="246" class="white heading">Demand overview</text>
  <text x="54" y="268" class="muted small">Review observed sales and model-generated demand predictions.</text>

  <rect x="54" y="286" width="190" height="66" rx="8" class="card"/>
  <text x="68" y="308" class="muted small">Forecasted units</text>
  <text x="68" y="331" class="white body">Awaiting data</text>
  <rect x="255" y="286" width="190" height="66" rx="8" class="card"/>
  <text x="269" y="308" class="muted small">Forecast horizon</text>
  <text x="269" y="331" class="white body">Select period</text>
  <rect x="456" y="286" width="230" height="66" rx="8" class="card"/>
  <text x="470" y="308" class="muted small">Model status</text>
  <text x="470" y="331" class="teal body">Not connected in this design</text>

  <text x="54" y="386" class="white label">FILTERS</text>
  <rect x="54" y="398" width="190" height="38" rx="6" class="card"/>
  <text x="67" y="422" class="muted body">Date range  ▾</text>
  <rect x="255" y="398" width="190" height="38" rx="6" class="card"/>
  <text x="268" y="422" class="muted body">Product  ▾</text>
  <rect x="456" y="398" width="230" height="38" rx="6" class="card"/>
  <text x="469" y="422" class="muted body">Category / Store  ▾</text>

  <rect x="54" y="452" width="632" height="274" rx="8" class="card"/>
  <text x="72" y="480" class="white body" font-weight="bold">Historical sales vs. forecast</text>
  <text x="72" y="501" class="muted small">Illustrative chart area — real values must come from data services.</text>
  <path d="M92 545H660 M92 590H660 M92 635H660 M92 680H660" class="grid"/>
  <path d="M92 530V690H660" class="line"/>
  <path d="M105 650 L165 625 L225 640 L285 585 L345 603 L405 565 L465 580" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <path d="M465 580 L515 555 L565 545 L615 520 L655 530" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
  <text x="105" y="710" class="muted small">Past observations</text>
  <line x1="230" y1="706" x2="254" y2="706" stroke="#60a5fa" stroke-width="3"/>
  <text x="265" y="710" class="muted small">Actual sales</text>
  <line x1="370" y1="706" x2="394" y2="706" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="405" y="710" class="muted small">Forecast</text>

  <text x="54" y="762" class="white heading">Product forecast details</text>
  <rect x="54" y="777" width="632" height="34" rx="5" fill="#202e40"/>
  <text x="65" y="799" class="white small">Product</text>
  <text x="238" y="799" class="white small">Actual units</text>
  <text x="355" y="799" class="white small">Predicted</text>
  <text x="465" y="799" class="white small">Period</text>
  <text x="578" y="799" class="white small">Status</text>
  <path d="M54 850H686 M54 891H686 M54 932H686" class="grid"/>
  <text x="65" y="836" class="muted body">Product A</text>
  <text x="238" y="836" class="muted small">Unavailable</text>
  <text x="355" y="836" class="muted small">Unavailable</text>
  <text x="465" y="836" class="muted small">Not set</text>
  <text x="578" y="836" class="amber small">Pending</text>
  <text x="65" y="877" class="muted body">Product B</text>
  <text x="238" y="877" class="muted small">Unavailable</text>
  <text x="355" y="877" class="muted small">Unavailable</text>
  <text x="465" y="877" class="muted small">Not set</text>
  <text x="578" y="877" class="amber small">Pending</text>
  <text x="54" y="970" class="muted small">Last updated: unavailable until a forecast service is connected.</text>

  <!-- Restocking screen -->
  <rect x="732" y="92" width="676" height="910" rx="14" class="panel"/>
  <rect x="732" y="92" width="676" height="58" rx="14" fill="#172438"/>
  <text x="754" y="127" class="white heading">Restocking Recommendations</text>
  <text x="754" y="178" class="muted small">NAVIGATION</text>
  <text x="754" y="202" class="muted body">Dashboard  /  Inventory  /  Forecasting  /</text>
  <rect x="1040" y="185" width="118" height="27" rx="6" fill="#24446a"/>
  <text x="1052" y="203" class="white small">Restocking</text>

  <text x="754" y="246" class="white heading">Stock requiring attention</text>
  <text x="754" y="268" class="muted small">Review suggested replenishment before making an ordering decision.</text>

  <rect x="754" y="286" width="190" height="66" rx="8" class="card"/>
  <text x="768" y="308" class="muted small">Low-stock products</text>
  <text x="768" y="331" class="white body">Awaiting data</text>
  <rect x="955" y="286" width="190" height="66" rx="8" class="card"/>
  <text x="969" y="308" class="muted small">Stockout risks</text>
  <text x="969" y="331" class="white body">Awaiting data</text>
  <rect x="1156" y="286" width="230" height="66" rx="8" class="card"/>
  <text x="1170" y="308" class="muted small">Recommendations</text>
  <text x="1170" y="331" class="white body">Review required</text>

  <text x="754" y="386" class="white label">FILTERS</text>
  <rect x="754" y="398" width="190" height="38" rx="6" class="card"/>
  <text x="767" y="422" class="muted body">Stock status  ▾</text>
  <rect x="955" y="398" width="190" height="38" rx="6" class="card"/>
  <text x="968" y="422" class="muted body">Category  ▾</text>
  <rect x="1156" y="398" width="230" height="38" rx="6" class="card"/>
  <text x="1169" y="422" class="muted body">Search product...</text>

  <rect x="754" y="452" width="632" height="344" rx="8" class="card"/>
  <text x="772" y="480" class="white body" font-weight="bold">Inventory and reorder review</text>
  <rect x="770" y="495" width="600" height="45" rx="4" fill="#202e40"/>
  <text x="780" y="513" class="white small">Product</text>
  <text x="780" y="529" class="muted small">SKU</text>
  <text x="900" y="521" class="white small">Stock</text>
  <text x="982" y="521" class="white small">Status</text>
  <text x="1070" y="513" class="white small">Suggested</text>
  <text x="1070" y="529" class="muted small">reorder</text>
  <text x="1190" y="521" class="white small">Action</text>

  <path d="M770 588H1370 M770 645H1370 M770 702H1370 M770 759H1370" class="grid"/>
  <text x="780" y="563" class="muted body">Product A</text>
  <text x="780" y="579" class="muted small">SKU pending</text>
  <text x="900" y="568" class="muted small">Unknown</text>
  <text x="982" y="568" class="amber small">Needs data</text>
  <text x="1070" y="568" class="muted small">Not calculated</text>
  <rect x="1190" y="548" width="145" height="28" rx="5" fill="#24446a"/>
  <text x="1205" y="567" class="white small">Review details</text>

  <text x="780" y="620" class="muted body">Product B</text>
  <text x="780" y="636" class="muted small">SKU pending</text>
  <text x="900" y="625" class="muted small">Unknown</text>
  <text x="982" y="625" class="amber small">Needs data</text>
  <text x="1070" y="625" class="muted small">Not calculated</text>
  <rect x="1190" y="605" width="145" height="28" rx="5" fill="#24446a"/>
  <text x="1205" y="624" class="white small">Review details</text>

  <text x="780" y="677" class="muted body">Product C</text>
  <text x="780" y="693" class="muted small">SKU pending</text>
  <text x="900" y="682" class="muted small">Unknown</text>
  <text x="982" y="682" class="amber small">Needs data</text>
  <text x="1070" y="682" class="muted small">Not calculated</text>
  <rect x="1190" y="662" width="145" height="28" rx="5" fill="#24446a"/>
  <text x="1205" y="681" class="white small">Review details</text>

  <text x="780" y="734" class="muted body">Product D</text>
  <text x="780" y="750" class="muted small">SKU pending</text>
  <text x="900" y="739" class="muted small">Unknown</text>
  <text x="982" y="739" class="amber small">Needs data</text>
  <text x="1070" y="739" class="muted small">Not calculated</text>
  <rect x="1190" y="719" width="145" height="28" rx="5" fill="#24446a"/>
  <text x="1205" y="738" class="white small">Review details</text>

  <rect x="754" y="817" width="632" height="126" rx="8" class="card"/>
  <text x="772" y="845" class="white body" font-weight="bold">Recommendation details</text>
  <text x="772" y="869" class="muted body">• Current stock and demand basis</text>
  <text x="772" y="891" class="muted body">• Reorder quantity and rule explanation, when available</text>
  <text x="772" y="913" class="muted body">• Supplier lead time, if supplied by the system</text>
  <text x="754" y="970" class="muted small">No order is placed until the shop owner explicitly confirms.</text>
</svg>
