  <text x="550" y="76" fill="#9ca3af" font-family="Arial" font-size="14" text-anchor="middle">M06-05 | Proposed Security Architecture</text>

  <rect x="35" y="105" width="1030" height="455" rx="18" fill="none" stroke="#475569" stroke-dasharray="7 5"/>
  <text x="55" y="130" fill="#94a3b8" font-family="Arial" font-size="12">RETAIL X SECURITY BOUNDARY</text>

  <g font-family="Arial" text-anchor="middle">
    <rect x="65" y="170" width="210" height="100" rx="12" fill="#111827" stroke="#64748b" stroke-width="2"/>
    <text x="170" y="205" fill="#f9fafb" font-size="18" font-weight="bold">User</text>
    <text x="170" y="230" fill="#cbd5e1" font-size="13">Owner / Manager</text>
    <text x="170" y="250" fill="#cbd5e1" font-size="13">or Administrator</text>

    <rect x="325" y="170" width="210" height="100" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
