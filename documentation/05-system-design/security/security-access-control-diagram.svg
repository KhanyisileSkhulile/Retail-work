    <text x="430" y="232" fill="#bfdbfe" font-size="13">Validate credentials</text>
    <text x="430" y="251" fill="#bfdbfe" font-size="13">Protect sign-in</text>

    <rect x="585" y="170" width="210" height="100" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="690" y="205" fill="#dbeafe" font-size="18" font-weight="bold">Session &amp; Identity</text>
    <text x="690" y="232" fill="#bfdbfe" font-size="13">Identify user role</text>
    <text x="690" y="251" fill="#bfdbfe" font-size="13">Protect session</text>

    <rect x="845" y="170" width="190" height="100" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="940" y="205" fill="#dbeafe" font-size="18" font-weight="bold">Backend RBAC</text>
    <text x="940" y="232" fill="#bfdbfe" font-size="13">Check permissions</text>
    <text x="940" y="251" fill="#bfdbfe" font-size="13">Deny by default</text>

    <g stroke="#94a3b8" stroke-width="2.5" fill="none">
      <path d="M275 220 H325"/>
      <path d="M315 213 L325 220 L315 227"/>
      <path d="M535 220 H585"/>
      <path d="M575 213 L585 220 L575 227"/>
      <path d="M795 220 H845"/>
      <path d="M835 213 L845 220 L835 227"/>
      <path d="M940 270 V315 H550 V350"/>
