    <path d="M940 270 V300 H125 V350" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="205" y="490" width="690" height="48" rx="10" fill="#312e18" stroke="#fbbf24" stroke-width="2"/>
    <text x="550" y="510" fill="#fef3c7" font-size="16" font-weight="bold">Security Audit Logging</text>
