    <text x="550" y="381" fill="#d1fae5" font-size="19" font-weight="bold">Authorised Retail Features</text>
    <text x="550" y="408" fill="#a7f3d0" font-size="14">Products • Sales • Inventory • Dashboard • Alerts</text>
    <text x="550" y="431" fill="#a7f3d0" font-size="14">Forecasting • Restocking • AI Assistant • Admin Functions</text>

    <rect x="65" y="350" width="120" height="110" rx="12" fill="#3b1720" stroke="#fb7185" stroke-width="2"/>
